        <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // URL do WebSocket
        const WS_URL = "wss://directory-vintage-std-sunny.trycloudflare.com/ws/multiping";
        
        const ADMIN_TELEGRAM_ID = 5735206781;
        
        // 2° Novo Smartlink
        const SMARTLINK_URL = "https://www.profitableratecpmnetwork.com/virn9qjb01?key=a4ad45efa12addc93f92f2e038e92e73";

        function openSmartlink() {
            const currentUserId = tg.initDataUnsafe?.user?.id;
            if (currentUserId && currentUserId === ADMIN_TELEGRAM_ID) {
                tg.openLink(SMARTLINK_URL);
            } else {
                tg.openLink(SMARTLINK_URL);
            }
        }

        // Função de Gatilho de Monetização (Auto-Click / Validação)
        function checkAndTriggerMonetization() {
            console.log("Verificando gatilho de monetização...");
            
            // Se você quiser que abra o Smartlink automaticamente sob alguma condição, 
            // a lógica vem aqui dentro. Exemplo:
            // const currentUserId = tg.initDataUnsafe?.user?.id;
            // se precisar disparar algo automático para o admin:
            // if (currentUserId === ADMIN_TELEGRAM_ID) { openSmartlink(); }
        }

        // Chamada da função assim que o Mini App é carregado
        checkAndTriggerMonetization();

        // Conexão WebSocket para o Multi-Ping Live
        function connectWS() {
            const ws = new WebSocket(WS_URL);
            const dot = document.getElementById('ws-status');
            const statusText = document.getElementById('status-text');

            ws.onopen = () => {
                dot.classList.add('connected');
                statusText.innerText = "STREAM LIVE";
                statusText.style.color = "#22c55e";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                document.getElementById('last-update').innerText = data.time;
                
                const container = document.getElementById('ping-container');
                container.innerHTML = '';

                data.pings.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'ping-card';
                    
                    let latClass = 'good';
                    if (item.ms > 120) latClass = 'warn';
                    if (item.ms === 0 || item.ms > 300) latClass = 'bad';

                    const isProxy = item.status === 'PROXY_ACTIVE';

                    card.innerHTML = `
                        <div class="target-name">${item.target}</div>
                        <div class="metrics">
                            <span class="badge ${isProxy ? 'active' : ''}">${item.status}</span>
                            <span class="latency ${latClass}">${item.ms > 0 ? item.ms + 'ms' : 'TIMEOUT'}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            };

            ws.onclose = () => {
                dot.classList.remove('connected');
                statusText.innerText = "RECONNECTING...";
                statusText.style.color = "#f59e0b";
                setTimeout(connectWS, 3000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        // Inicia a conexão com o servidor
        connectWS();
    </script>
